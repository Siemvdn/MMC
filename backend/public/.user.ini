; PHP-instellingen voor productie (CLAUDE.md §11).
;
; Waarom dit bestand er is terwijl index.php display_errors ook al zet: een
; fout in index.php zelf — een parseerfout na een half geslaagde upload
; bijvoorbeeld — treedt op vóórdat die regel wordt uitgevoerd. Dan is dit
; bestand het enige dat nog voorkomt dat er een stack trace met bestandspaden
; in de browser verschijnt.
;
; Veel shared hosting draait PHP als FPM. Daar werkt `php_flag` in .htaccess niet, maar
; .user.ini wel; die geldt voor deze map en alles eronder.
;
; Let op: index.php zet display_errors alsnog aan als APP_ENV=development in
; .env staat. Dat is bedoeld voor lokaal werk. Op de server hoort APP_ENV op
; production te staan, zodat beide hetzelfde zeggen.

display_errors = Off
display_startup_errors = Off

; Fouten gaan naar het log, altijd. Zonder pad schrijft PHP naar het
; standaard foutlog van de hosting; de applicatie zelf logt daarnaast naar
; storage/logs/error.log.
log_errors = On

; expose_php staat hier bewust NIET in: dat is een systeeminstelling die
; .user.ini niet mag wijzigen. De X-Powered-By-header wordt in plaats daarvan
; in index.php verwijderd met header_remove().

; ── Sessies (CLAUDE.md §11) ─────────────────────────────────────────────────
;
; Deze staan óók in src/Http/Session.php, dat ze bij het starten van elke
; sessie zet. Dat is geen dubbel werk: als een toekomstig script ooit een
; sessie start zonder die class te gebruiken, gelden deze regels alsnog.

; Accepteer nooit een sessie-ID dat de server niet zelf heeft uitgegeven.
; Staat standaard uit, en zonder deze regel is session fixation mogelijk.
session.use_strict_mode = 1

; Alleen cookies als drager van het sessie-ID; nooit in de URL, want dan lekt
; hij mee in verwijzingen naar andere sites en in serverlogs.
session.use_only_cookies = 1
session.use_trans_sid = 0

session.cookie_httponly = 1
session.cookie_samesite = Strict

; ── Uploads (CLAUDE.md §11, §13) ────────────────────────────────────────────
;
; Het beheerscherm verkleint een foto in de browser vóór het uploaden, dus in
; de praktijk komt hier een bestand van een paar honderd kilobyte binnen. Deze
; ruimte is er voor het geval dat niet lukt — dan moet de klant zijn foto nog
; steeds kwijt kunnen.
;
; post_max_size moet boven upload_max_filesize liggen: het verzoek draagt naast
; het bestand ook de formuliervelden en de scheidingstekens.
;
; Let op: sommige hostingpakketten leggen hier zelf een plafond op en negeren
; deze regels. Dat is hier geen ramp — door het verkleinen in de browser komt
; er toch niets groots aan.
upload_max_filesize = 24M
post_max_size = 26M
max_file_uploads = 5
